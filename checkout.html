<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Pop &amp; Lock</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}input,textarea,select,button{font:inherit}.top{background:#fff;border-bottom:1px solid #eee}.icons{height:100px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 20px}.icon{display:flex;justify-content:center}.icon svg{width:38px;height:38px;stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.brand{justify-self:center;width:70px}.brand img{width:70px;height:70px;object-fit:contain}.menu{height:65px;display:flex;justify-content:center;align-items:center;gap:35px;overflow-x:auto;white-space:nowrap}.menu a{font-size:20px;font-weight:600}.page{width:min(1100px,calc(100% - 32px));margin:auto;padding:50px 0 80px}h1{font-size:42px;font-weight:400;text-align:center;margin:0 0 38px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:45px}.box{border:1px solid #ddd;padding:28px;margin-bottom:22px}.box h2{font-size:20px;font-weight:400;margin:0 0 22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0;padding:13px;border:1px solid #ccc;border-radius:0;background:#fff}.field textarea{min-height:90px;resize:vertical}.summary{border:1px solid #ddd;padding:25px;height:max-content;position:sticky;top:20px}.summary h2{font-size:21px;font-weight:400;margin:0 0 20px}.item{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}.item small{display:block;color:#777;margin-top:4px}.row{display:flex;justify-content:space-between;margin:13px 0;font-size:14px}.total{font-size:18px;font-weight:700;border-top:1px solid #eee;padding-top:18px;margin-top:18px}.pay{width:100%;border:0;background:#111;color:#fff;padding:16px;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px}.pay:hover{background:#333}.notice{font-size:12px;color:#777;line-height:1.5;text-align:center;margin-top:15px}.empty{text-align:center;padding:80px 20px}.empty a{text-decoration:underline}footer{border-top:1px solid #eee;text-align:center;padding:45px 20px 60px}.footer-nav{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;font-weight:700}.copy{margin-top:22px;color:#777;font-size:12px}@media(max-width:760px){.icons{height:88px;padding:0 6px}.icon svg{width:32px;height:32px}.brand,.brand img{width:62px;height:62px}.menu{height:58px;justify-content:flex-start;padding:0 16px;gap:25px}.menu a{font-size:16px}.page{width:calc(100% - 20px);padding:35px 0 55px}h1{font-size:32px;margin-bottom:25px}.layout{display:block}.fields{display:block}.field{margin-bottom:18px}.summary{position:static;margin-top:25px}.box{padding:20px 15px}}</style></head><body>
<header class="top"><div class="icons"><a class="icon" href="#" aria-label="Account"><svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="8"></circle><path d="M10 38c0-8 6-13 14-13s14 5 14 13"></path></svg></a><a class="icon" href="#" aria-label="Wishlist"><svg viewBox="0 0 48 48"><path d="M24 38S7 28 7 16c0-6 4-10 10-10 3 0 6 2 7 5 2-3 4-5 8-5 5 0 9 4 9 10 0 12-17 22-17 22z"></path></svg></a><a class="brand" href="index.html"><img src="logo.png?v=4" alt="Pop &amp; Lock"></a><a class="icon" href="shop.html#shop-search" aria-label="Search"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"></circle><path d="M29 29l11 11"></path></svg></a><a class="icon" href="bag.html" aria-label="Bag"><svg viewBox="0 0 48 48"><path d="M11 17h26l2 24H9z"></path><path d="M17 17v-5c0-5 3-8 7-8s7 3 7 8v5"></path></svg></a></div><nav class="menu"><a href="shop.html">SHOP</a><a href="live-shows.html">LIVE SHOWS</a><a href="sell-to-us.html">SELL TO US</a><a href="contact.html">CONTACT</a></nav></header>
<main class="page"><h1>Checkout</h1><div id="app"></div></main><footer><nav class="footer-nav"><a href="about.html">ABOUT</a><a href="shipping.html">SHIPPING</a><a href="returns.html">RETURNS</a><a href="contact.html">CONTACT</a></nav><div class="copy">© Pop &amp; Lock</div></footer>
<script>
const app=document.getElementById('app');const bag=JSON.parse(localStorage.getItem('popandlock-bag')||'[]');async function load(){const products=await (await fetch('products.json?v='+Date.now())).json();const items=bag.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);if(!items.length){app.innerHTML='<div class="empty"><h2>Your bag is empty</h2><p><a href="shop.html">Return to the shop</a></p></div>';return}const subtotal=items.reduce((n,x)=>n+x.p.price*x.qty,0);const standardShipping=3.27;const trackedShipping=5.95;app.innerHTML='<form id="checkoutForm"><div class="layout"><div><section class="box"><h2>Contact details</h2><div class="fields"><div class="field"><label>First name *</label><input name="firstName" required></div><div class="field"><label>Last name *</label><input name="lastName" required></div><div class="field full"><label>Email address *</label><input type="email" name="email" required></div><div class="field"><label>Phone number</label><input type="tel" name="phone"></div></div></section><section class="box"><h2>Delivery address</h2><div class="fields"><div class="field full"><label>Address *</label><input name="address" required></div><div class="field"><label>Town / City *</label><input name="city" required></div><div class="field"><label>Postcode *</label><input name="postcode" required></div><div class="field full"><label>Delivery option *</label><select name="delivery" required><option value="">Please select</option><option value="Standard UK Delivery">Standard UK Delivery — £3.27</option><option value="Tracked UK Delivery">Tracked UK Delivery — £5.95</option></select></div><div class="field full"><label>Order notes (optional)</label><textarea name="notes"></textarea></div></div></section></div><aside class="summary"><h2>Your Order</h2>'+items.map(x=>'<div class="item"><span>'+x.qty+' × '+String(x.p.name).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'<small>'+x.p.category+'</small></span><b>£'+(x.p.price*x.qty).toFixed(2)+'</b></div>').join('')+'<div class="row"><span>Subtotal</span><span>£'+subtotal.toFixed(2)+'</span></div><div class="row"><span>Shipping</span><span id="shippingAmount">Select delivery</span></div><div class="row total"><span>Total</span><span id="orderTotal">£'+subtotal.toFixed(2)+'</span></div><button class="pay" type="submit">CONTINUE TO PAYMENT</button><div class="notice">You will be securely redirected to Stripe to pay by card, Apple Pay or Google Pay.</div></aside></div></form>';const deliverySelect=document.querySelector('[name="delivery"]');const shippingAmountEl=document.getElementById('shippingAmount');const orderTotalEl=document.getElementById('orderTotal');function updateTotals(){const shipping=deliverySelect.value==='Standard UK Delivery'?standardShipping:deliverySelect.value==='Tracked UK Delivery'?trackedShipping:0;shippingAmountEl.textContent=deliverySelect.value?(('£'+shipping.toFixed(2))):'Select delivery';orderTotalEl.textContent='£'+(subtotal+shipping).toFixed(2)}deliverySelect.addEventListener('change',updateTotals);updateTotals();document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;const button=form.querySelector('.pay');button.disabled=true;button.textContent='CONNECTING TO STRIPE...';try{const data=Object.fromEntries(new FormData(form).entries());const response=await fetch('https://popandlock-payments.popandlock31.workers.dev/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:data.email,delivery:data.delivery,items:bag.map(x=>({id:x.id,qty:x.qty})),customer:{firstName:data.firstName,lastName:data.lastName,phone:data.phone,address:data.address,city:data.city,postcode:data.postcode,notes:data.notes}})});const result=await response.json();if(!response.ok||!result.url)throw new Error(result.error||'Unable to start payment.');window.location.href=result.url}catch(error){alert(error.message||'Unable to start payment. Please try again.');button.disabled=false;button.textContent='CONTINUE TO PAYMENT'}})}load().catch(()=>app.innerHTML='<div class="empty"><h2>Unable to load checkout</h2><a href="bag.html">Return to bag</a></div>');
</script></body></html>
