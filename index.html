;height:100%;object-fit:cover}.arrival-price{font-size:20px;font-weight:700;margin-bottom:20px}.reel-arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid rgba(255,255,255,.65);background:rgba(0,0,0,.35);color:#fff;font-size:25px;line-height:1;cursor:pointer}.reel-prev{left:20px}.reel-next{right:20px}.reel-dots{position:absolute;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.reel-dot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer}.reel-dot.active{background:#fff;transform:scale(1.25)}.collection-heading{text-align:center;padding:48px 20px 28px}.collection-heading h2{font-size:34px;font-weight:400;margin:0 0 8px}.collection-heading p{margin:0;color:#777}.categories{width:100%;display:flex;flex-direction:column}.category{position:relative;width:100%;height:clamp(280px,48vw,520px);overflow:hidden;background:#111}.category img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}.category:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.3),rgba(0,0,0,.03) 55%,rgba(0,0,0,.12))}.category:hover img{transform:scale(1.025)}.label{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:clamp(42px,7vw,92px);font-weight:400;letter-spacing:1px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.category.marvel img{object-position:50% 50%}.category.dc img{object-position:72% 50%}.category.disney img{object-position:50% 50%}.category.horror img{object-position:50% 50%}.category.tv-film img{object-position:50% 50%}.category.music img{object-position:50% 50%}.category.anime img{object-position:50% 42%}.category.grails img{object-position:50% 50%}.category.signed img{object-position:50% 50%}.category.other img{object-position:50% 50%}
footer{background:#fff;text-align:center;padding:45px 20px 60px}.footer-nav{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;font-weight:700;text-transform:uppercase}.copy{margin-top:22px;color:#777;font-size:12px}
@media(max-width:760px){.hero-slide{min-height:390px}.arrival-inner{width:100%;padding:35px 55px;gap:20px;flex-direction:column-reverse;text-align:center}.arrival-product{width:min(250px,62vw)}.arrival-copy h2{font-size:30px}.arrival-copy p{font-size:13px}.arrival-price{font-size:18px;margin-bottom:16px}.reel-arrow{width:36px;height:36px}.reel-prev{left:10px}.reel-next{right:10px}.icons{height:112px;padding:0 22px}.icon svg{width:43px;height:43px}.bag-count{top:6px;right:calc(50% - 24px)}.brand{width:76px}.brand img{width:76px;height:76px}.menu{height:76px;justify-content:flex-start;padding:0 40px;gap:48px}.menu a{font-size:22px}.hero{min-height:390px}.hero-content{padding:42px 18px}.hero-logo{width:96px;height:96px}.hero h1{font-size:42px;letter-spacing:2px}.hero p{font-size:11px;letter-spacing:1.4px}.hero-btn{padding:13px 19px}.collection-heading{padding:38px 18px 24px}.collection-heading h2{font-size:28px}.category{height:clamp(300px,62vw,600px)}.label{font-size:clamp(46px,8vw,88px)}}
@media(min-width:1100px){.categories{max-width:1400px;margin:auto}.category{height:520px}.label{font-size:82px}}
 .header-search{display:none;border-top:1px solid #eee;padding:14px 20px;background:#fff}.header-search form{max-width:900px;margin:auto;position:relative}.header-search input{width:100%;height:48px;border:1px solid #ccc;padding:0 16px;font-size:16px;outline:0}.header-search input:focus{border-color:#111}.header-search.open{display:block}.latest{max-width:1400px;margin:0 auto;padding:0 24px 70px}.latest-head{text-align:center;margin:0 0 26px}.latest-head h2{font-size:34px;font-weight:400;margin:0 0 8px}.latest-head p{margin:0;color:#777}.latest-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.latest-card{border:1px solid #e7e7e7;background:#fff;min-width:0}.latest-card .latest-pic{aspect-ratio:1;background:#f7f7f7;display:flex;align-items:center;justify-content:center;overflow:hidden}.latest-card .latest-pic img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}.latest-card:hover .latest-pic img{transform:scale(1.025)}.latest-info{padding:14px}.latest-info .latest-tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:#777;text-transform:uppercase;margin-bottom:7px}.latest-info h3{font-size:15px;font-weight:500;line-height:1.35;margin:0 0 8px}.latest-price{font-size:15px;font-weight:700}.latest-cta{text-align:center;margin-top:28px}.latest-cta a{display:inline-block;background:#111;color:#fff;padding:14px 24px;font-size:12px;font-weight:700;letter-spacing:.08em}</style>

<body>
<header class="top">
<div class="icons"><a class="icon" href="#" aria-label="Search" id="searchToggle"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"></circle><path d="M29 29l11 11"></path></svg></a><a class="brand" href="index.html" aria-label="Pop &amp; Lock"><img src="logo.png?v=4" alt="Pop &amp; Lock"></a><a class="icon" href="bag.html" aria-label="Bag"><span class="bag-count" aria-label="Items in bag">0</span><svg viewBox="0 0 48 48"><path d="M11 17h26l2 24H9z"></path><path d="M17 17v-5c0-5 3-8 7-8s7 3 7 8v5"></path></svg></a></div><div class="header-search" id="headerSearch"><form action="shop.html" method="get"><input id="headerSearchInput" name="search" type="search" placeholder="Search Funko Pops..." autocomplete="off"></form></div>
<nav class="menu" aria-label="Main navigation"><a href="shop.html">SHOP</a><a href="live-shows.html">LIVE SHOWS</a><a href="sell-to-us.html">SELL TO US</a><a href="contact.html">CONTACT</a></nav>
</header>
<main><section class="hero-reel"><div class="hero-track" id="heroTrack"><section class="hero-slide"><div class="hero-content"><img class="hero-logo" src="logo.png?v=4" alt="Pop &amp; Lock"><h1>POP &amp; LOCK</h1><p>FUNKO POPS • EXCLUSIVES • GRAILS • SIGNED</p><div class="hero-actions"><a class="hero-btn" href="shop.html">SHOP NOW</a><a class="hero-btn alt" href="sell-to-us.html">SELL TO US</a></div></div></section></div><button class="reel-arrow reel-prev" id="reelPrev" aria-label="Previous slide">‹</button><button class="reel-arrow reel-next" id="reelNext" aria-label="Next slide">›</button><div class="reel-dots" id="reelDots"></div></section><section class="collection-heading"><h2>SHOP BY COLLECTION</h2><p>Find your next favourite Pop.</p></section><section class="categories" id="homepageCategories"></section></main>
<script>
function updateBagCount(){
  try{
    const bag=JSON.parse(localStorage.getItem('popandlock-bag')||'[]');
    const count=bag.reduce((n,x)=>n+Math.max(0,Number(x.qty)||0),0);
    document.querySelectorAll('.bag-count').forEach(el=>{el.textContent=count;el.style.display=count?'block':'none'});
  }catch(e){}
}
document.addEventListener('DOMContentLoaded',updateBagCount);
window.addEventListener('storage',updateBagCount);

(async function(){
  const fallback=[
    ["marvel","MARVEL","MARVEL.jpg","shop.html#marvel"],
    ["dc","DC","DC.jpg","shop.html#dc"],
    ["disney","DISNEY","DISNEY.jfif","shop.html#disney"],
    ["horror","HORROR","HORROR.jfif","shop.html#horror"],
    ["tv-film","TV & FILM","TV & FILM.jpg","shop.html#tv-film"],
    ["music","MUSIC","MUSIC.jpg","shop.html#music"],
    ["anime","ANIME","ANIME.jpg","shop.html#anime"],
    ["grails","GRAILS","GRAILS.jpg","shop.html#grails"],
    ["signed","SIGNED","SIGNED.jpg","shop.html#signed"],
    ["other","OTHER","OTHER.jpg","shop.html#other"]
  ];
  function render(items){
    const root=document.getElementById("homepageCategories");
    root.innerHTML=items.filter(x=>x.visible!==false).map(x=>
      '<a class="category '+String(x.id).replace(/[^a-z0-9_-]/gi,'')+'" href="'+String(x.link||('#'+x.id)).replace(/"/g,'&quot;')+'"><img src="'+String(x.image||'').replace(/"/g,'&quot;')+'?v='+Date.now()+'" alt="'+String(x.name||'').replace(/"/g,'&quot;')+'"><span class="label">'+String(x.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span></a>'
    ).join("");
  }
  try{
    const r=await fetch("homepage.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error();
    render(await r.json());
  }catch(e){
    render(fallback.map(x=>({id:x[0],name:x[1],image:x[2],link:x[3],visible:true})));
  }
})();

(async function(){
  try{
    const r=await fetch("products.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error();
    const products=await r.json();
    const available=products.filter(p=>Number(p.stock)>0).slice().reverse().slice(0,4);
    const track=document.getElementById("heroTrack"),dots=document.getElementById("reelDots");
    if(!available.length){document.getElementById("reelPrev").style.display="none";document.getElementById("reelNext").style.display="none";return;}
    available.forEach((p,i)=>{const slide=document.createElement("section");slide.className="hero-slide arrival-slide";slide.innerHTML='<div class="arrival-inner"><div class="arrival-copy"><div class="arrival-kicker">NEW ARRIVAL</div><h2>'+String(p.name||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</h2><p>Freshly added to Pop &amp; Lock.</p><div class="arrival-price">£'+Number(p.price||0).toFixed(2)+'</div><a class="hero-btn" href="product.html?id='+encodeURIComponent(p.id)+'">VIEW PRODUCT</a></div><a class="arrival-product" href="product.html?id='+encodeURIComponent(p.id)+'">'+(p.image?'<img src="'+String(p.image).replace(/"/g,"&quot;")+'" alt="'+String(p.name||"").replace(/"/g,"&quot;")+'">':"")+'</a></div>';track.appendChild(slide);const dot=document.createElement("button");dot.className="reel-dot"+(i===0?"":"");dot.setAttribute("aria-label","Go to slide "+(i+2));dot.addEventListener("click",()=>track.scrollTo({left:track.clientWidth*(i+1),behavior:"smooth"}));dots.appendChild(dot);});
    const allDots=[...dots.children];allDots.unshift(document.createElement("span"));allDots[0].className="reel-dot active";allDots[0].setAttribute("aria-label","Home slide");allDots[0].addEventListener("click",()=>track.scrollTo({left:0,behavior:"smooth"}));dots.replaceChildren(...allDots);
    function update(){const index=Math.round(track.scrollLeft/track.clientWidth);allDots.forEach((d,i)=>d.classList.toggle("active",i===index));}
    track.addEventListener("scroll",()=>requestAnimationFrame(update));
    document.getElementById("reelPrev").addEventListener("click",()=>{const i=Math.round(track.scrollLeft/track.clientWidth);track.scrollTo({left:Math.max(0,i-1)*track.clientWidth,behavior:"smooth"});});
    document.getElementById("reelNext").addEventListener("click",()=>{const i=Math.round(track.scrollLeft/track.clientWidth);track.scrollTo({left:Math.min(track.children.length-1,i+1)*track.clientWidth,behavior:"smooth"});});
  }catch(e){}
})();
</script>
