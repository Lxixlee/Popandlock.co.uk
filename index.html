<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Pop &amp; Lock | Funko Pops</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}
.top{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}.icons{height:112px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 34px}.icon{display:flex;align-items:center;justify-content:center;color:#111}.icon{position:relative}.icon svg{width:48px;height:48px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.bag-count{position:absolute;top:24px;right:calc(50% - 30px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#111;color:#fff;font-size:11px;font-weight:700;line-height:22px;text-align:center;display:none;pointer-events:none}.brand{justify-self:center;width:82px}.brand img{width:82px;height:82px;object-fit:contain}.menu{display:flex;justify-content:center;gap:42px;height:76px;align-items:center;overflow-x:auto;white-space:nowrap;border-top:0}.menu a{font-size:24px;font-weight:500}.menu a:hover{text-decoration:underline}
.categories{width:100%;display:flex;flex-direction:column}.category{position:relative;width:100%;height:clamp(280px,48vw,520px);overflow:hidden;background:#111}.category img{width:100%;height:100%;object-fit:cover}.category:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.18),rgba(0,0,0,.03) 55%,rgba(0,0,0,.08))}.label{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:clamp(42px,7vw,92px);font-weight:400;letter-spacing:1px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.category.marvel img{object-position:50% 50%}.category.dc img{object-position:72% 50%}.category.disney img{object-position:50% 50%}.category.horror img{object-position:50% 50%}.category.tv-film img{object-position:50% 50%}.category.music img{object-position:50% 50%}.category.anime img{object-position:50% 42%}.category.grails img{object-position:50% 50%}.category.signed img{object-position:50% 50%}.category.other img{object-position:50% 50%}
footer{background:#fff;text-align:center;padding:45px 20px 60px}.footer-nav{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;font-weight:700;text-transform:uppercase}.copy{margin-top:22px;color:#777;font-size:12px}
@media(max-width:760px){.icons{height:112px;padding:0 22px}.icon svg{width:43px;height:43px}.bag-count{top:22px;right:calc(50% - 28px)}.brand{width:76px}.brand img{width:76px;height:76px}.menu{height:76px;justify-content:flex-start;padding:0 40px;gap:48px}.menu a{font-size:22px}.category{height:clamp(300px,62vw,600px)}.label{font-size:clamp(46px,8vw,88px)}}
@media(min-width:1100px){.categories{max-width:1400px;margin:auto}.category{height:520px}.label{font-size:82px}}
</style>
</head>
<body>
<header class="top">
<div class="icons"><a class="icon" href="shop.html" aria-label="Search"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"></circle><path d="M29 29l11 11"></path></svg></a><a class="brand" href="index.html" aria-label="Pop &amp; Lock"><img src="logo.png?v=4" alt="Pop &amp; Lock"></a><a class="icon" href="bag.html" aria-label="Bag"><span class="bag-count" aria-label="Items in bag">0</span><svg viewBox="0 0 48 48"><path d="M11 17h26l2 24H9z"></path><path d="M17 17v-5c0-5 3-8 7-8s7 3 7 8v5"></path></svg></a></div>
<nav class="menu" aria-label="Main navigation"><a href="shop.html">SHOP</a><a href="live-shows.html">LIVE SHOWS</a><a href="sell-to-us.html">SELL TO US</a><a href="contact.html">CONTACT</a></nav>
</header>
<main class="categories" id="homepageCategories"></main>
<script>
function updateBagCount(){
  try{
    const bag=JSON.parse(localStorage.getItem('popandlock-bag')||'[]');
    const count=bag.reduce((n,x)=>n+Math.max(0,Number(x.qty)||0),0);
    document.querySelectorAll('.bag-count').forEach(el=>{el.textContent=count;el.style.display=count?'block':'none'});
  }catch(e){}
}
document.addEventListener('DOMContentLoaded',updateBagCount);
window.addEventListener('storage',updateBagCount);

(async function(){
  const fallback=[
    ["marvel","MARVEL","MARVEL.jpg","shop.html#marvel"],
    ["dc","DC","DC.jpg","shop.html#dc"],
    ["disney","DISNEY","DISNEY.jfif","shop.html#disney"],
    ["horror","HORROR","HORROR.jfif","shop.html#horror"],
    ["tv-film","TV & FILM","TV & FILM.jpg","shop.html#tv-film"],
    ["music","MUSIC","MUSIC.jpg","shop.html#music"],
    ["anime","ANIME","ANIME.jpg","shop.html#anime"],
    ["grails","GRAILS","GRAILS.jpg","shop.html#grails"],
    ["signed","SIGNED","SIGNED.jpg","shop.html#signed"],
    ["other","OTHER","OTHER.jpg","shop.html#other"]
  ];
  function render(items){
    const root=document.getElementById("homepageCategories");
    root.innerHTML=items.filter(x=>x.visible!==false).map(x=>
      '<a class="category '+String(x.id).replace(/[^a-z0-9_-]/gi,'')+'" href="'+String(x.link||('#'+x.id)).replace(/"/g,'&quot;')+'"><img src="'+String(x.image||'').replace(/"/g,'&quot;')+'?v='+Date.now()+'" alt="'+String(x.name||'').replace(/"/g,'&quot;')+'"><span class="label">'+String(x.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span></a>'
    ).join("");
  }
  try{
    const r=await fetch("homepage.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error();
    render(await r.json());
  }catch(e){
    render(fallback.map(x=>({id:x[0],name:x[1],image:x[2],link:x[3],visible:true})));
  }
})();
</script>
<footer><nav class="footer-nav"><a href="about.html">ABOUT</a><a href="shipping.html">SHIPPING</a><a href="returns.html">RETURNS</a><a href="contact.html">CONTACT</a></nav><div class="copy">© Pop &amp; Lock</div></footer>
</body>
</html>
