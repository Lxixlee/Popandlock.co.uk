<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product | Pop &amp; Lock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}
.top{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}.icons{height:112px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:center;padding:0 34px}.icon{display:flex;align-items:center;justify-content:center}.icon svg{width:48px;height:48px;stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.brand{justify-self:center;width:82px}.brand img{width:82px;height:82px;object-fit:contain}.menu{display:flex;justify-content:center;gap:42px;height:76px;align-items:center;overflow-x:auto;white-space:nowrap}.menu a{font-size:24px;font-weight:500}
.page{width:min(1200px,calc(100% - 32px));margin:auto;padding:55px 0 90px}.crumb{font-size:13px;color:#777;margin-bottom:30px}.product{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px}.image{aspect-ratio:1;background:#f7f7f7;display:flex;align-items:center;justify-content:center;overflow:hidden}.image img{width:100%;height:100%;object-fit:contain}.placeholder{color:#aaa;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.details{padding:10px 0}.tag{font-size:12px;font-weight:700;color:#777;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.details h1{font-size:42px;font-weight:400;line-height:1.15;margin:0 0 18px}.price{font-size:25px;font-weight:700;margin-bottom:24px}.line{height:1px;background:#eee;margin:24px 0}.meta{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;line-height:1.5}.meta b{font-weight:700}.description{font-size:15px;line-height:1.7;color:#555}.stock{font-size:13px;margin:20px 0}.button{display:block;width:100%;background:#111;color:#fff;border:0;padding:17px;text-align:center;font-size:14px;font-weight:700;cursor:pointer}.button:hover{background:#333}.button:disabled{background:#aaa;cursor:not-allowed}.back{display:inline-block;margin-top:25px;font-size:13px;text-decoration:underline}
.notfound{text-align:center;padding:80px 20px}.notfound h1{font-size:36px;font-weight:400}
footer{border-top:1px solid #eee;text-align:center;padding:45px 20px 60px}.footer-nav{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;font-weight:700}.copy{margin-top:22px;color:#777;font-size:12px}
@media(max-width:760px){.icons{height:112px;padding:0 22px}.icon svg{width:43px;height:43px}.brand{width:76px}.brand img{width:76px;height:76px}.menu{height:76px;justify-content:flex-start;padding:0 40px;gap:48px}.menu a{font-size:22px}.page{width:calc(100% - 28px);padding-top:35px}.product{grid-template-columns:1fr;gap:30px}.details h1{font-size:32px}.meta{grid-template-columns:125px 1fr}}
@media(max-width:420px){.icons{padding:0 10px}.menu{padding:0 20px;gap:30px}.menu a{font-size:19px}}
</style></head><body>
<header class="top"><div class="icons">
<a class="icon" href="#" aria-label="Account"><svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="8"></circle><path d="M10 38c0-8 6-13 14-13s14 5 14 13"></path></svg></a>
<a class="icon" href="#" aria-label="Wishlist"><svg viewBox="0 0 48 48"><path d="M24 38S7 28 7 16c0-6 4-10 10-10 3 0 6 2 7 5 2-3 4-5 8-5 5 0 9 4 9 10 0 12-17 22-17 22z"></path></svg></a>
<a class="brand" href="index.html"><img src="logo.png?v=4" alt="Pop &amp; Lock"></a>
<a class="icon" href="shop.html#shop-search" aria-label="Search"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"></circle><path d="M29 29l11 11"></path></svg></a>
<a class="icon" href="#" aria-label="Bag"><svg viewBox="0 0 48 48"><path d="M11 17h26l2 24H9z"></path><path d="M17 17v-5c0-5 3-8 7-8s7 3 7 8v5"></path></svg></a>
</div><nav class="menu"><a href="shop.html">SHOP</a><a href="live-shows.html">LIVE SHOWS</a><a href="sell-to-us.html">SELL TO US</a><a href="contact.html">CONTACT</a></nav></header>
<main class="page" id="app"></main>
<footer><nav class="footer-nav"><a href="about.html">ABOUT</a><a href="shipping.html">SHIPPING</a><a href="returns.html">RETURNS</a><a href="contact.html">CONTACT</a></nav><div class="copy">© Pop &amp; Lock</div></footer>
<script>
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const r=await fetch('products.json?v='+Date.now());const products=await r.json();const id=new URLSearchParams(location.search).get('id');const p=products.find(x=>x.id===id);if(!p){app.innerHTML='<div class="notfound"><h1>Product not found</h1><p>That product is no longer available.</p><a class="back" href="shop.html">Back to shop</a></div>';return}document.title=esc(p.name)+' | Pop &amp; Lock';app.innerHTML='<div class="crumb"><a href="shop.html">Shop</a> / '+esc(p.category)+'</div><section class="product"><div class="image">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<span class="placeholder">Product photo</span>')+'</div><div class="details"><div class="tag">'+esc(p.category)+'</div><h1>'+esc(p.name)+'</h1><div class="price">£'+Number(p.price).toFixed(2)+'</div><div class="line"></div><div class="meta"><b>Condition</b><span>'+esc(p.condition||'Not specified')+'</span><b>Box condition</b><span>'+esc(p.boxCondition||'Not specified')+'</span></div><div class="line"></div><div class="description">'+esc(p.description||'More information coming soon.')+'</div><div class="stock">'+(Number(p.stock)>0?'In stock — '+Number(p.stock)+' available':'Out of stock')+'</div><button class="button" id="add" '+(Number(p.stock)>0?'':'disabled')+'>ADD TO BAG</button><a class="back" href="shop.html">← Back to shop</a></div></section>';document.getElementById('add')?.addEventListener('click',()=>{alert('Bag/checkout is the next step. This product is ready to be added once the basket is connected.');})}catch(e){app.innerHTML='<div class="notfound"><h1>Something went wrong</h1><a class="back" href="shop.html">Back to shop</a></div>'}}load();
</script></body></html>
