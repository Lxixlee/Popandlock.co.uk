<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Bag | Pop &amp; Lock</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid #eee}.icons{height:112px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:center;padding:0 34px}.icon{display:flex;align-items:center;justify-content:center}.icon svg{width:48px;height:48px;stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.brand{justify-self:center;width:82px}.brand img{width:82px;height:82px;object-fit:contain}.menu{display:flex;justify-content:center;gap:42px;height:76px;align-items:center;overflow-x:auto;white-space:nowrap}.menu a{font-size:24px;font-weight:500}.page{width:min(1000px,calc(100% - 32px));margin:auto;padding:55px 0 90px}h1{font-size:44px;font-weight:400;margin:0 0 35px;text-align:center}.layout{display:grid;grid-template-columns:1fr 330px;gap:45px}.item{display:grid;grid-template-columns:120px 1fr auto;gap:18px;padding:18px 0;border-top:1px solid #eee;align-items:center}.pic{width:120px;height:120px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;text-transform:uppercase;text-align:center}.pic img{width:100%;height:100%;object-fit:contain}.name{font-size:16px;margin:0 0 8px}.meta{font-size:12px;color:#777}.qty{margin-top:15px;display:flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border:1px solid #ccc;background:#fff;cursor:pointer}.remove{border:0;background:none;text-decoration:underline;font-size:12px;padding:0;margin-top:12px;cursor:pointer}.itemprice{font-weight:700}.summary{border:1px solid #ddd;padding:24px;height:max-content}.summary h2{font-size:21px;font-weight:400;margin:0 0 22px}.row{display:flex;justify-content:space-between;margin:12px 0;font-size:14px}.total{font-weight:700;font-size:18px;border-top:1px solid #eee;padding-top:18px;margin-top:18px}.checkout{display:block;text-align:center;background:#111;color:#fff;padding:16px;margin-top:22px;font-size:13px;font-weight:700}.note{font-size:11px;color:#777;line-height:1.5;margin-top:15px;text-align:center}.empty{text-align:center;padding:70px 20px;border-top:1px solid #eee}.empty p{color:#777}.shop{display:inline-block;background:#111;color:#fff;padding:14px 25px;font-size:13px;font-weight:700;margin-top:10px}footer{border-top:1px solid #eee;text-align:center;padding:45px 20px 60px}.footer-nav{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;font-weight:700}.copy{margin-top:22px;color:#777;font-size:12px}@media(max-width:760px){.icons{height:100px;padding:0 10px}.icon svg{width:36px;height:36px}.bag-count{top:19px;right:calc(50% - 25px)}.brand,.brand img{width:68px;height:68px}.menu{height:65px;justify-content:flex-start;padding:0 20px;gap:30px}.menu a{font-size:18px}.page{width:calc(100% - 20px);padding:35px 0 60px}h1{font-size:34px;margin-bottom:25px}.layout{display:block}.summary{margin-top:30px}.item{grid-template-columns:80px 1fr;gap:12px}.pic{width:80px;height:80px}.itemprice{grid-column:2}.qty{margin-top:10px}}</style></head><body>
<header class="top"><div class="icons"><a class="icon" href="#" aria-label="Account"><svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="8"></circle><path d="M10 38c0-8 6-13 14-13s14 5 14 13"></path></svg></a><a class="icon" href="#" aria-label="Wishlist"><svg viewBox="0 0 48 48"><path d="M24 38S7 28 7 16c0-6 4-10 10-10 3 0 6 2 7 5 2-3 4-5 8-5 5 0 9 4 9 10 0 12-17 22-17 22z"></path></svg></a><a class="brand" href="index.html"><img src="logo.png?v=4" alt="Pop &amp; Lock"></a><a class="icon" href="shop.html#shop-search" aria-label="Search"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"></circle><path d="M29 29l11 11"></path></svg></a><a class="icon" href="bag.html" aria-label="Bag"><span class="bag-count" aria-label="Items in bag">0</span><svg viewBox="0 0 48 48"><path d="M11 17h26l2 24H9z"></path><path d="M17 17v-5c0-5 3-8 7-8s7 3 7 8v5"></path></svg></a></div><nav class="menu"><a href="shop.html">SHOP</a><a href="live-shows.html">LIVE SHOWS</a><a href="sell-to-us.html">SELL TO US</a><a href="contact.html">CONTACT</a></nav></header>
<main class="page"><h1>Your Bag</h1><div id="app"></div></main><footer><nav class="footer-nav"><a href="about.html">ABOUT</a><a href="shipping.html">SHIPPING</a><a href="returns.html">RETURNS</a><a href="contact.html">CONTACT</a></nav><div class="copy">© Pop &amp; Lock</div></footer>
<script>
function updateBagCount(){
  try{
    const bag=JSON.parse(localStorage.getItem('popandlock-bag')||'[]');
    const count=bag.reduce((n,x)=>n+Math.max(0,Number(x.qty)||0),0);
    document.querySelectorAll('.bag-count').forEach(el=>{el.textContent=count;el.style.display=count?'block':'none'});
  }catch(e){}
}
document.addEventListener('DOMContentLoaded',updateBagCount);
window.addEventListener('storage',updateBagCount);

const app=document.getElementById('app');const money=n=>'£'+n.toFixed(2);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const products=await (await fetch('products.json?v='+Date.now())).json();let bag=JSON.parse(localStorage.getItem('popandlock-bag')||'[]');bag=bag.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);if(!bag.length){app.innerHTML='<div class="empty"><h2>Your bag is empty</h2><p>Find something you love and add it to your bag.</p><a class="shop" href="shop.html">SHOP FUNKOS</a></div>';return}const subtotal=()=>bag.reduce((n,x)=>n+x.p.price*x.qty,0);function render(){app.innerHTML='<div class="layout"><div>'+bag.map((x,i)=>'<article class="item"><div class="pic">'+(x.p.image?'<img src="'+esc(x.p.image)+'" alt="'+esc(x.p.name)+'">':'Product photo')+'</div><div><h2 class="name">'+esc(x.p.name)+'</h2><div class="meta">'+esc(x.p.category)+' · '+esc(x.p.condition||'Condition not specified')+'</div><div class="qty"><button onclick="change('+i+',-1)">−</button><span>'+x.qty+'</span><button onclick="change('+i+',1)">+</button></div><button class="remove" onclick="removeItem('+i+')">Remove</button></div><div class="itemprice">'+money(x.p.price*x.qty)+'</div></article>').join('')+'</div><aside class="summary"><h2>Order Summary</h2><div class="row"><span>Subtotal</span><span>'+money(subtotal())+'</span></div><div class="row"><span>Shipping</span><span>Calculated at checkout</span></div><div class="row total"><span>Total</span><span>'+money(subtotal())+'</span></div><a class="checkout" href="#" onclick="return checkout()">PROCEED TO CHECKOUT</a><div class="note">Checkout and payment will be connected once your payment provider is set up.</div></aside></div>'}window.change=(i,d)=>{bag[i].qty+=d;if(bag[i].qty<1)bag.splice(i,1);save()};window.removeItem=i=>{bag.splice(i,1);save()};function save(){localStorage.setItem('popandlock-bag',JSON.stringify(bag));render()}window.checkout=()=>{location.href='checkout.html';return false};render()}load().catch(()=>app.innerHTML='<div class="empty"><h2>Unable to load your bag</h2><a class="shop" href="shop.html">BACK TO SHOP</a></div>');
</script></body></html>
