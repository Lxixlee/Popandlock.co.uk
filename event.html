function makeParticles(theme){
var box=document.getElementById('particles'),g={halloween:['🦇','👻','🎃','🕷','💀'],christmas:['❄','❄','🎁','✦'],newyear:['✦','✧','🎆','✨'],valentines:['♥','♡','💌'],easter:['🌸','🐰','🥚'],bonfire:['🔥','✦','•'],diwali:['🪔','✨','✦'],summer:['☀','🌊','✦'],blackfriday:['$','★','✦'],holiday:['🎁','✦','✨']}[theme]||['✦','•'];

var p=document.createElement('span');p.className='event-particle glyph';p.textContent=g[i%g.length];
p.style.setProperty('--start-left',(Math.random()*100)+'%');p.style.setProperty('--start-top',(5+Math.random()*85)+'%');
p.style.fontSize=(12+Math.random()*20)+'px';p.style.animationDuration=(7+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*12)+'s';
p.style.setProperty('--drift',(-110+Math.random()*220)+'px');p.style.setProperty('--drift-mid',(-55+Math.random()*110)+'px');
p.style.setProperty('--float-y',(-35+Math.random()*70)+'px');p.style.setProperty('--float-y-end',(-120-Math.random()*180)+'px');
p.style.setProperty('--spin',(-180+Math.random()*360)+'deg');p.style.setProperty('--spin2',(-360+Math.random()*720)+'deg');box.appendChild(p);

var line=document.createElement('div');line.className='intro-line';wrap.appendChild(line);intro.appendChild(wrap);
document.body.appendChild(intro);

function add(cls,text,x,y,size,delay,extra){

for(var g=0;g<6;g++)add('intro-gifts',g%2?'🎁':'🔔',g<3?8+g*10:62+(g-3)*10,68-Math.abs(2-g)*4,28,.35+g*.1,{'--from':(g%2?'120px':'-120px')}).style.animation='giftSlide 1.5s cubic-bezier(.2,.8,.2,1) '+(.35+g*.1)+'s forwards';
}else if(theme==='newyear'){
var count=document.createElement('div');count.className='intro-countdown';intro.appendChild(count);var n=3;function tick(){if(n>0){count.textContent=n;count.style.animation='none';void count.offsetWidth;count.style.animation='countPop .65s ease forwards';n--;setTimeout(tick,650)}else{count.remove();for(var f=0;f<90;f++)add('intro-confetti',f%2?'✦':'•',50,35,8+Math.random()*16,0,{'--dx':(-55+Math.random()*110)+'vw','--rot':(-720+Math.random()*1440)+'deg'}).style.animation='confettiFall '+(1.8+Math.random()*1.5)+'s ease-out forwards';for(var q=0;q<4;q++){var cx=20+q*20,cy=25+(q%2)*10;for(var z=0;z<18;z++)add('intro-particles','✦',cx,cy,10+Math.random()*15,0,{'--dx':(-100+Math.random()*200)+'px','--dy':(-100+Math.random()*200)+'px'}).style.animation='firework 1.1s ease-out '+(q*.18)+'s forwards'}}}tick();
}else if(theme==='valentines'){
for(var hrt=0;hrt<30;hrt++)add('intro-hearts',hrt%3?'♥':'♡',Math.random()*100,15+Math.random()*70,12+Math.random()*28,Math.random()*1.1,{'--dx':(-100+Math.random()*200)+'px','--rot':(-35+Math.random()*70)+'deg'}).style.animation='heartFloat '+(2+Math.random()*1.5)+'s ease-out '+(Math.random()*1.1)+'s forwards';
}else if(theme==='easter'){

for(var ep=0;ep<10;ep++)add('intro-eggs','🥚',5+Math.random()*90,72+Math.random()*18,18+Math.random()*15,.2+Math.random(),{'--dx':(-70+Math.random()*140)+'px','--dy':(-80-Math.random()*100)+'px','--rot':(-40+Math.random()*80)+'deg'}).style.animation='eggPop 1.8s ease-out '+(.2+Math.random())+'s forwards';
}else if(theme==='bonfire'){
var fire=document.createElement('div');fire.className='intro-ground-fire';layer.appendChild(fire);
for(var sp=0;sp<55;sp++)add('intro-sparks','•',35+Math.random()*30,72+Math.random()*20,8+Math.random()*16,.05+Math.random(),{'--dx':(-90+Math.random()*180)+'px','--dy':(-100-Math.random()*180)+'px'}).style.animation='sparkBurst '+(1+Math.random()*1.5)+'s ease-out '+(.05+Math.random())+'s forwards';

}else if(theme==='summer'){

}else if(theme==='stpatricks'){

}else if(theme==='mothersday'){
for(var md=0;md<25;md++)add('intro-flowers',md%2?'🌸':'💐',Math.random()*100,15+Math.random()*70,14+Math.random()*22,.1+Math.random(),{'--dx':(-100+Math.random()*200)+'px','--dy':(-80-Math.random()*140)+'px','--rot':(-50+Math.random()*100)+'deg'}).style.animation='floatUp 2.1s ease-out '+(.1+Math.random())+'s forwards';
}else if(theme==='fathersday'){
for(var fd=0;fd<22;fd++)add('intro-particles',fd%2?'★':'🎁',Math.random()*100,15+Math.random()*70,14+Math.random()*20,.1+Math.random(),{'--dx':(-100+Math.random()*200)+'px','--dy':(-90-Math.random()*130)+'px','--rot':(-40+Math.random()*80)+'deg'}).style.animation='floatUp 2s ease-out '+(.1+Math.random())+'s forwards';
}else{
for(var p=0;p<24;p++)add('intro-stars','✦',Math.random()*100,Math.random()*100,8+Math.random()*18,.1+Math.random(),{}).style.animation='sparkle 1.5s ease-in-out '+(.1+Math.random())+'s forwards';
}
setTimeout(function(){intro.classList.add('is-done');setTimeout(function(){intro.remove()},900)},3600);
}
(async function(){
try{
var id=new URLSearchParams(location.search).get('event');if(!id){location.replace('index.html');return}
var events=[];try{var er=await fetch('events.json?v='+Date.now(),{cache:'no-store'});if(er.ok)events=await er.json()}catch(fetchErr){} var e=events.find(function(x){return String(x.id)===String(id)});if(!e){var fallbackTitles={'christmas':'CHRISTMAS','new-year':'NEW YEAR','valentines':"VALENTINE'S DAY",'mothers-day':"MOTHER'S DAY",'st-patricks':"ST PATRICK'S DAY",'easter':'EASTER','fathers-day':"FATHER'S DAY",'summer':'SUMMER SALE','halloween':'HALLOWEEN','bonfire':'BONFIRE NIGHT','diwali':'DIWALI','black-friday':'BLACK FRIDAY','boxing-day':'BOXING DAY SALE'};if(!fallbackTitles[id]){location.replace('index.html');return}e={id:id,title:fallbackTitles[id],visible:true,products:[]}}
var title=e.title||e.name||'EVENT',theme=themeFor(title);window.currentTheme=theme;document.getElementById('page').className='event-page theme-'+theme;runEventIntro(title,theme);document.title=title+' | Pop & Lock';

var copy=eventCopy(theme,title);document.getElementById('eventHeading').textContent=copy[1];document.getElementById('eventEndTitle').textContent=copy[2];document.getElementById('eventShopIntro').textContent=copy[0];

var shop=document.getElementById('eventProducts');if(!chosen.length){shop.innerHTML='<div class="event-empty">The event collection is being refreshed. Check back soon.</div>'}else{shop.innerHTML=chosen.map(function(p){var badge=theme==='halloween'?'SPOOKY PICK':theme==='christmas'?'CHRISTMAS PICK':theme==='newyear'?'NEW YEAR PICK':theme==='valentines'?'LOVE PICK':theme==='bonfire'?'NIGHT PICK':'EVENT PICK';return '<article class="event-product"><div class="product-art"><img src="'+esc(p.image||'')+'" alt="'+esc(p.name||'')+'"></div><div class="product-info"><span class="event-badge">'+badge+'</span><h3>'+esc(p.name||'')+'</h3><div class="event-price">£'+Number(p.price||0).toFixed(2)+'</div><a class="event-buy" href="product.html?id='+encodeURIComponent(p.id)+'">VIEW PRODUCT</a></div></article>'}).join('')}
}catch(err){location.replace('index.html')}

(async function(){try{var r=await fetch('events.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;var events=await r.json(),menu=document.getElementById('mainMenu');events.filter(function(e){return e&&e.visible===true}).forEach(function(e){var a=document.createElement('a');a.href=e.link||('event.html?event='+encodeURIComponent(e.id));a.textContent=e.title||e.name||'EVENT';var live=Array.from(menu.querySelectorAll('a')).find(function(x){return x.textContent.trim()==='LIVE SHOWS'});if(live)live.insertAdjacentElement('afterend',a);else menu.appendChild(a)})}catch(e){}})();
