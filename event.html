(async function(){

else if(eventName.includes('valentine')) theme='valentines';
else if(eventName.includes('easter')) theme='easter';
else if(eventName.includes('patrick')||eventName.includes('mother')||eventName.includes('father')) theme='holiday';
else if(eventName.includes('bonfire')) theme='bonfire';
else if(eventName.includes('black friday')) theme='blackfriday';
else if(eventName.includes('new year')) theme='newyear';
else if(eventName.includes('summer')) theme='summer';
else if(eventName.includes('diwali')) theme='diwali';

document.getElementById('eventShop').className='event-shop theme-'+theme+'-shop';

 intro.textContent='Browse the Pop & Lock collection for '+(e.title||e.name||'this event')+'.';

 const eventId=(new URLSearchParams(location.search).get('event')||'').toLowerCase();
 let glyphs=['✦','✧','•'];
 if(eventId.includes('halloween'))glyphs=['🦇','🎃','🧙‍♀️','🕷','🕸','👻','💀'];
 else if(eventId.includes('christmas')||eventId.includes('boxing'))glyphs=['❄','❄','✦','•'];
 else if(eventId.includes('new-year')||eventId.includes('newyear'))glyphs=['✦','✧','•','✷'];
 else if(eventId.includes('valentine'))glyphs=['♥','♡','•'];
 else if(eventId.includes('easter'))glyphs=['✦','•','🌸'];
 else if(eventId.includes('bonfire'))glyphs=['✦','•','🔥'];
 else if(eventId.includes('diwali'))glyphs=['✦','✧','•','🪔'];
 else if(eventId.includes('summer'))glyphs=['•','✦','☀'];
 for(let n=0;n<30;n++){
   const p=document.createElement('span');p.className='event-particle glyph';
   p.textContent=glyphs[n%glyphs.length];
   p.style.left=(Math.random()*100)+'%';
   p.style.fontSize=(10+Math.random()*20)+'px';
   p.style.animationDuration=(8+Math.random()*13)+'s';
   p.style.animationDelay=(-Math.random()*18)+'s';
   p.style.setProperty('--drift',(-90+Math.random()*180)+'px');
   p.style.setProperty('--spin',(-180+Math.random()*360)+'deg');
   box.appendChild(p);
 }
 page.appendChild(box);
})();
</script></body></html>
