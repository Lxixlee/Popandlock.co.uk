</style></style></head><body id="page"><header class="top"><div class="icons"><a class="icon" href="#" aria-label="Search" id="searchToggle"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"></circle><path d="M29 29l11 11"></path></svg></a><a class="brand" href="index.html" aria-label="Pop &amp; Lock"><img src="logo.png?v=4" alt="Pop &amp; Lock"></a><a class="icon" href="bag.html" aria-label="Bag"><span class="bag-count" aria-label="Items in bag">0</span><svg viewBox="0 0 48 48"><path d="M11 17h26l2 24H9z"></path><path d="M17 17v-5c0-5 3-8 7-8s7 3 7 8v5"></path></svg></a></div><div class="header-search" id="headerSearch"><form action="shop.html" method="get"><input id="headerSearchInput" name="search" type="search" placeholder="Search Funko Pops..." autocomplete="off"></form></div><nav class="menu" id="mainMenu" aria-label="Main navigation"><a href="shop.html">SHOP</a><a href="thrilljoy.html">THRILLJOY</a><a href="live-shows.html">LIVE SHOWS</a><a href="sell-to-us.html">SELL TO US</a><a href="contact.html">CONTACT</a></nav></header><div class="wrap"><section class="event" id="event"><div class="copy"><h1>EVENT</h1></div></section><section class="event-shop" id="eventShop"><h2>SHOP THE EVENT</h2><p class="event-shop-intro" id="eventShopIntro">Loading the collection...</p><div class="event-products" id="eventProducts"></div></section><section class="note"><h2>More to discover</h2><p>Browse the full Pop &amp; Lock collection for Funko Pops, grails and signed pieces.</p></section></div>
<script>
(async function(){
const id=new URLSearchParams(location.search).get('event');
try{
const r=await fetch('events.json?v='+Date.now(),{cache:'no-store'});
if(!r.ok) throw new Error('Events unavailable');
const events=await r.json();
const e=events.find(x=>String(x.id)===String(id));
if(!e || e.visible!==true){
  location.replace('index.html');
  return;
}
document.title=(e.title||e.name||'Event')+' | Pop & Lock';
const eventName=String(e.title||e.name||'event').toLowerCase();
let theme='default';
if(eventName.includes('christmas')||eventName.includes('boxing')) theme='christmas';
else if(eventName.includes('halloween')) theme='halloween';
else if(eventName.includes('valentine')) theme='valentines';
else if(eventName.includes('easter')) theme='easter';
else if(eventName.includes('patrick')||eventName.includes('mother')||eventName.includes('father')) theme='holiday';
else if(eventName.includes('bonfire')) theme='bonfire';
else if(eventName.includes('black friday')) theme='blackfriday';
else if(eventName.includes('new year')) theme='newyear';
else if(eventName.includes('summer')) theme='summer';
else if(eventName.includes('diwali')) theme='diwali';
document.getElementById('page').className='event-page theme-'+theme;
document.getElementById('event').className='event';
document.getElementById('eventShop').className='event-shop theme-'+theme+'-shop';
document.getElementById('event').innerHTML='<img class="event-bg" src="'+(e.image||'')+'" alt="'+(e.title||e.name||'Event')+'" onerror="this.style.display=\'none\'"><div class="shade"></div><div class="copy"><h1>'+ (e.title||e.name||'Event') +'</h1></div>';
const pr=await fetch('products.json?v='+Date.now(),{cache:'no-store'});
if(pr.ok){
 const products=await pr.json();
 const shop=document.getElementById('eventProducts');
 const intro=document.getElementById('eventShopIntro');
 intro.textContent='Browse the Pop & Lock collection for '+(e.title||e.name||'this event')+'.';
 const available=products.filter(function(p){return Number(p.stock||0)>0});
 if(!available.length){shop.innerHTML='<div class="event-empty">No products are currently available.</div>';}
 else {
   shop.innerHTML=available.map(function(p){
     return '<article class="event-product"><img src="'+String(p.image||'')+'" alt="'+String(p.name||'').replace(/"/g,'&quot;')+'"><h3>'+String(p.name||'')+'</h3><div class="event-price">£'+Number(p.price||0).toFixed(2)+'</div><a class="event-buy" href="product.html?id='+encodeURIComponent(p.id)+'">VIEW PRODUCT</a></article>';
   }).join('');
 }
}
}catch(err){
  location.replace('index.html');
}
})();
</script>
<script>(async function(){try{const r=await fetch('events.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const events=await r.json();const menu=document.getElementById('mainMenu');events.filter(e=>e&&e.visible===true).forEach(e=>{const a=document.createElement('a');a.href=e.link||('event.html?event='+encodeURIComponent(e.id));a.textContent=e.title||e.name||'EVENT';const live=Array.from(menu.querySelectorAll('a')).find(x=>x.textContent.trim()==='LIVE SHOWS');if(live)live.insertAdjacentElement('afterend',a);else menu.appendChild(a);});}catch(e){}})();</script></body></html>
