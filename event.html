)}.event-page.theme-christmas .event,.event-page.theme-halloween .event,.event-page.theme-newyear .event,.event-page.theme-valentines .event,.event-page.theme-easter .event,.event-page.theme-holiday .event,.event-page.theme-bonfire .event,.event-page.theme-blackfriday .event,.event-page.theme-summer .event,.event-page.theme-diwali .event{position:relative;z-index:2}.event-page .event-shop,.event-page .note{position:relative;z-index:2}.event-page.theme-christmas{background:linear-gradient(180deg,#f2fff8 0%,#fff 55%);color:#143d2f}.event-page.theme-christmas .event-shop{background:transparent}.event-page.theme-christmas .event-shop h2{color:#8b0000}.event-page.theme-christmas .event-buy{background:#8b0000}.event-page.theme-christmas .note{background:#fff7f7}

</style></head><body id="page"><div class="wrap"><a class="back" href="index.html">← BACK TO POP &amp; LOCK</a><section class="event" id="event"><div class="copy"><div class="kicker">POP &amp; LOCK EVENT</div><h1>POP &amp; LOCK</h1><p>Explore our latest event.</p><a class="btn" href="shop.html">SHOP ALL</a></div></section><section class="event-shop" id="eventShop"><h2>SHOP THE EVENT</h2><p class="event-shop-intro" id="eventShopIntro">Loading the collection...</p><div class="event-products" id="eventProducts"></div></section><section class="note"><h2>More to discover</h2><p>Browse the full Pop &amp; Lock collection for Funko Pops, grails and signed pieces.</p></section></div>
<script>
(async function(){
const id=new URLSearchParams(location.search).get('event');
try{
const r=await fetch('events.json?v='+Date.now(),{cache:'no-store'});
if(!r.ok) throw new Error('Events unavailable');
const events=await r.json();
const e=events.find(x=>String(x.id)===String(id));
if(!e || e.visible!==true){
  location.replace('index.html');
  return;
}
document.title=(e.title||e.name||'Event')+' | Pop & Lock';
const eventName=String(e.title||e.name||'event').toLowerCase();
let theme='default';
if(eventName.includes('christmas')||eventName.includes('boxing')) theme='christmas';
else if(eventName.includes('halloween')) theme='halloween';
else if(eventName.includes('valentine')) theme='valentines';
else if(eventName.includes('easter')) theme='easter';
else if(eventName.includes('patrick')||eventName.includes('mother')||eventName.includes('father')) theme='holiday';
else if(eventName.includes('bonfire')) theme='bonfire';
else if(eventName.includes('black friday')) theme='blackfriday';
else if(eventName.includes('new year')) theme='newyear';
else if(eventName.includes('summer')) theme='summer';
else if(eventName.includes('diwali')) theme='diwali';
document.getElementById('page').className='event-page theme-'+theme;
document.getElementById('event').className='event';
document.getElementById('eventShop').className='event-shop theme-'+theme+'-shop';
document.getElementById('event').innerHTML='<img class="event-bg" src="'+(e.image||'')+'" alt="'+(e.title||e.name||'Event')+'" onerror="this.style.display=\'none\'"><div class="shade"></div><div class="copy"><div class="kicker">POP &amp; LOCK EVENT</div><h1>'+ (e.title||e.name||'Event') +'</h1><p>'+ (e.subtitle||'Explore this Pop & Lock event.') +'</p><a class="btn" href="#eventShop">SHOP NOW</a></div>';
const pr=await fetch('products.json?v='+Date.now(),{cache:'no-store'});
if(pr.ok){
 const products=await pr.json();
 const shop=document.getElementById('eventProducts');
 const intro=document.getElementById('eventShopIntro');
 intro.textContent='Browse the Pop & Lock collection for '+(e.title||e.name||'this event')+'.';
 const available=products.filter(function(p){return Number(p.stock||0)>0});
 if(!available.length){shop.innerHTML='<div class="event-empty">No products are currently available.</div>';}
 else {
   shop.innerHTML=available.map(function(p){
     return '<article class="event-product"><img src="'+String(p.image||'')+'" alt="'+String(p.name||'').replace(/"/g,'&quot;')+'"><h3>'+String(p.name||'')+'</h3><div class="event-price">£'+Number(p.price||0).toFixed(2)+'</div><a class="event-buy" href="product.html?id='+encodeURIComponent(p.id)+'">VIEW PRODUCT</a></article>';
   }).join('');
 }
}
}catch(err){
  location.replace('index.html');
}
})();
</script>
