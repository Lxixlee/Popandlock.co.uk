<script>function updateBagCount(){try{const bag=JSON.parse(localStorage.getItem("popandlock-bag")||"[]");const count=bag.reduce((n,x)=>n+Math.max(0,Number(x.qty)||0),0);document.querySelectorAll(".bag-count").forEach(el=>{el.textContent=count;el.style.display=count?"block":"none"});}catch(e){}}document.addEventListener("DOMContentLoaded",updateBagCount);window.addEventListener("storage",updateBagCount);</script><script>(function(){const t=document.getElementById("searchToggle"),b=document.getElementById("headerSearch"),i=document.getElementById("headerSearchInput");if(t&&b){t.addEventListener("click",function(e){e.preventDefault();b.classList.toggle("open");if(b.classList.contains("open")){i.focus();i.scrollIntoView({block:"nearest"});}});}})();</script></body></html>
